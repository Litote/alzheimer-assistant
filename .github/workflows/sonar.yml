name: SonarCloud Analysis

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - 'build.gradle.kts'
      - 'front/build.gradle.kts'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'front/**'
      - 'build.gradle.kts'
      - 'front/build.gradle.kts'
      - '.github/**'

concurrency:
  group: front-sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Litote/ci/.github/actions/setup-gradle@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Flutter
        uses: $/.github/actions/setup-flutter
        with:
          working-directory: front

      - uses: Litote/ci/.github/actions/detect-changes@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
        id: detect-changes
        with:
          pattern: '\.(dart|yaml|yml|toml|kts|gradle)$'

      - name: Run checks and tests with coverage
        run: ./gradlew check

      - name: SonarCloud analysis
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        if: env.SONAR_TOKEN != '' && steps.detect-changes.outputs.has-code-changes == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./gradlew sonar \
              -Dsonar.pullrequest.key="$PR_NUMBER" \
              -Dsonar.pullrequest.branch="$PR_BRANCH" \
              -Dsonar.pullrequest.base="$PR_BASE"
          else
            ./gradlew sonar
          fi
