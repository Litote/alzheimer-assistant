version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      exclude:
        - "Litote/*"
    groups:
      # A release of Litote/ci updates several workflows and actions: bump them in a single PR
      litote-ci:
        patterns:
          - "Litote/ci/*"
    labels:
      - dependencies
      - github-actions

  # ── Flutter / Dart (pub) ────────────────────────────────────────────────────
  - package-ecosystem: pub
    directory: /front
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - flutter

  # ── Firebase CLI (front-android-distribution workflow) ──────────────────────
  - package-ecosystem: npm
    directory: /.github/firebase-tools
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Only firebase-tools itself: its transitive dependencies follow its releases
    allow:
      - dependency-type: direct
    labels:
      - dependencies
      - github-actions
