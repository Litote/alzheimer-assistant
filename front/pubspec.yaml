name: alzheimer_assistant
description: 'Alzheimer Assistant - Voice-based assistant app'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  bloc: 9.2.1
  flutter_bloc: 9.1.1

  # Routing
  go_router: 18.0.1

  # Data models
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # UI
  google_fonts: 8.2.1
  cupertino_icons: 1.0.9
  wakelock_plus: 1.8.0
  livekit_client: 2.13.0

  # Voice input
  speech_to_text: 7.5.0

  # Microphone streaming (raw PCM 16kHz for ADK Live)
  record: 7.1.1

  # WebSocket transport (ADK Live bidi streaming)
  web_socket_channel: 3.0.3

  # Audio playback — buffered WAV mode (BufferedAudioPlayerService)
  audioplayers: 6.8.1

  # Real-time PCM Audio playback — PCM streaming mode (PcmStreamingAudioPlayerService)
  flutter_pcm_sound:
    git:
      url: https://github.com/chipweinberger/flutter_pcm_sound.git
      ref: fa4c9775054e567f890f4df7018eccefef142d99

  # File system utilities (WAV temp file for BufferedAudioPlayerService)
  path_provider: 2.1.6

  # Phone calls
  flutter_contacts: 2.5.0
  flutter_phone_direct_caller: 2.2.1

  # Permissions
  # Pinned below 13.x: permission_handler_android 14.1.0 declares compileSdk 37,
  # which doesn't exist in the current Android SDK platform naming (only 37.0/37.1/37.2).
  permission_handler: 12.0.1

  # Auth
  supabase_flutter: 2.17.2
  app_links: 7.2.1

  # Utilities
  logger: 2.8.0
  shared_preferences: 2.5.5
  #device_info_plus: 12.3.0 # Fixed version to avoid build error on CI introduced in 12.4.0
  #connectivity_plus: 7.0.0 # Fixed version to avoid build error on CI introduced in 7.1.0

  # Client-side TTS
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.1
  freezed: 4.0.1
  json_serializable: 6.14.1
  bloc_test: 10.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
