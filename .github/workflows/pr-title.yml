name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
    with:
      allowed-paths: ^$
