name: Front — Android Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.*'

concurrency:
  group: front-android-distribution-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: front

jobs:
  firebase:
    name: Build & Upload to Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # restricted to main and the v* tags by a deployment policy
    environment: android-distribution
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project targets Java 17 (see build.gradle.kts)
      - uses: Litote/ci/.github/actions/setup-gradle@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
        with:
          java-version: '17'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@ec46616b182954a0aa8013241b8d4565760db8de # v0.11.0
        with:
          working-directory: front

      # ── Signing ─────────────────────────────────────────────────────────────
      # android/key.properties switches build.gradle.kts to the upload key and
      # to the "Alzheimer Assistant" name. Both files are git-ignored.
      - name: Write upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # ── App secrets ─────────────────────────────────────────────────────────
      - name: Create secrets.json
        env:
          ADK_BASE_URL: ${{ secrets.ADK_BASE_URL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > secrets.json <<EOF
          {
            "ADK_BASE_URL": "$ADK_BASE_URL",
            "ELEVENLABS_API_KEY": "$ELEVENLABS_API_KEY",
            "ELEVENLABS_VOICE_ID": "$ELEVENLABS_VOICE_ID",
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
          }
          EOF

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # ── Build ────────────────────────────────────────────────────────────────
      # The run number is the versionCode: Android installs an update only when
      # it is higher than the installed one.
      - name: Build APK (release)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=secrets.json

      # ── Upload to Firebase App Distribution ──────────────────────────────────
      # --ignore-scripts: the dependencies' install scripts never run; the CLI
      # does not need them.
      - name: Install Firebase CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund firebase-tools@15.35.0

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$REF_NAME (${SHA:0:7})"

      # ── Cleanup ──────────────────────────────────────────────────────────────
      - name: Delete signing and service account files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/firebase-sa.json" android/key.properties
