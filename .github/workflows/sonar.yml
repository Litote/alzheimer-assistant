name: SonarCloud Analysis

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - 'build.gradle.kts'
      - 'front/build.gradle.kts'
      - '.github/**'
  pull_request:
    branches: [main]

concurrency:
  group: front-sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  # Replaces a paths filter on pull_request: a workflow that does not start leaves its required
  # checks pending forever, whereas a skipped job counts as successful.
  scope:
    name: Detect PR scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.detect-changes.outputs.has-code-changes == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/detect-changes@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        if: github.event_name == 'pull_request'
        id: detect-changes
        with:
          pattern: '^front/|^build\.gradle\.kts$|^\.github/'

  sonar:
    name: SonarCloud
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Litote/ci/.github/actions/setup-gradle@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Flutter
        uses: Litote/ci/.github/actions/setup-flutter@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        with:
          working-directory: front

      - uses: Litote/ci/.github/actions/detect-changes@731f25b65744afb6ed50783472a6746193353272 # v0.6.0
        id: detect-changes
        with:
          pattern: '\.(dart|yaml|yml|toml|kts|gradle)$'

      - name: Run checks and tests with coverage
        run: ./gradlew check

      - name: SonarCloud analysis
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        if: env.SONAR_TOKEN != '' && steps.detect-changes.outputs.has-code-changes == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./gradlew sonar \
              -Dsonar.pullrequest.key="$PR_NUMBER" \
              -Dsonar.pullrequest.branch="$PR_BRANCH" \
              -Dsonar.pullrequest.base="$PR_BASE"
          else
            ./gradlew sonar
          fi
