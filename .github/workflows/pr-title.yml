name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@fe7f5d3c7b0763dc89db8a8f90606284114ceb54 # v0.13.0
    with:
      allowed-paths: ^$
