name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@ec46616b182954a0aa8013241b8d4565760db8de # v0.11.0

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@ec46616b182954a0aa8013241b8d4565760db8de # v0.11.0
    with:
      allowed-paths: ^$
